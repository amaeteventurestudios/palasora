# Puts Palasora on the server whenever main changes, next to the other projects there (each has its own site file in the
# shared Caddy web server). One-time setup, in the repo's Settings > Secrets and variables > Actions:
#   Secrets:
#     SERVER_HOST       the server's public IP address
#     SERVER_USER       the login name (ubuntu on Oracle Cloud)
#     SERVER_SSH_KEY    the whole private key file (BEGIN ... END lines included)
#   Variables (optional):
#     PALASORA_DOMAIN   the site's names, separated by spaces, main one first. Without it: palasora.com and
#                       www.palasora.com (their DNS A records point at the server), plus
#                       palasora.<the IP with dashes>.sslip.io, a free name that always points at that IP.
# The town stays off on the server (TOWN_LIVE_ENABLED=false) until the owner's go for Phase 8 (docs/PHASE-8-REPORT.md).
name: Deploy to server
on:
  push:
    branches: [main]
    paths: ['apps/web/**', 'services/editorial/palavva_editorial/**', 'services/editorial/requirements.lock', 'services/pocketbase/pb_migrations/**',
      'services/pocketbase/pb_hooks/**', 'infra/server/**', '.github/workflows/deploy.yml']
  workflow_dispatch:
concurrency: deploy-palasora
jobs:
  deploy:
    runs-on: ubuntu-24.04-arm   # the server is ARM too, so the website's native parts are built for it
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Build the website
        working-directory: apps/web
        env: { NEXT_TELEMETRY_DISABLED: 1 }
        run: |
          npm install -g pnpm@12.10.1 --no-audit --no-fund
          pnpm install --frozen-lockfile
          pnpm exec vitest run
          pnpm build
          cp -r .next/static .next/standalone/.next/static
          cp -r public .next/standalone/public
      - name: Pack
        run: |
          mkdir -p pack/services/editorial pack/services/pocketbase pack/apps/web/lib/i18n pack/apps/web/public
          cp -r apps/web/.next/standalone pack/web
          cp -r services/editorial/palavva_editorial services/editorial/requirements.lock pack/services/editorial/
          cp -r services/pocketbase/pb_migrations services/pocketbase/pb_hooks pack/services/pocketbase/
          cp apps/web/lib/i18n/registry.json pack/apps/web/lib/i18n/
          cp -r apps/web/public/geo pack/apps/web/public/
          find pack -name __pycache__ -prune -exec rm -rf {} +
          tar czf palasora.tgz -C pack .
          ls -lh palasora.tgz
      - name: Copy to the server and (re)start the services
        env:
          HOST: ${{ secrets.SERVER_HOST }}
          USER: ${{ secrets.SERVER_USER }}
          KEY: ${{ secrets.SERVER_SSH_KEY }}
          DOMAIN: ${{ vars.PALASORA_DOMAIN }}
        run: |
          set -euo pipefail
          if [ -z "$HOST" ] || [ -z "$KEY" ]; then echo '::error::Add the SERVER_HOST, SERVER_USER and SERVER_SSH_KEY secrets first.'; exit 1; fi
          # Forgive extra words pasted into the secrets: keep just the address, the login and the key block
          HOST=$(printf '%s' "$HOST" | grep -oE '[0-9]{1,3}(\.[0-9]{1,3}){3}|[A-Za-z0-9-]+(\.[A-Za-z0-9-]+)+' | tail -1)
          USER=$(printf '%s' "$USER" | grep -oE '[a-z_][a-z0-9_-]*' | tail -1); USER="${USER:-ubuntu}"
          install -m 600 /dev/null key && printf '%s\n' "$KEY" | tr -d '\r' | sed -n '/-----BEGIN/,/-----END/p' > key
          [ -s key ] || { echo '::error::SERVER_SSH_KEY should hold the whole key file, from the -----BEGIN line to the -----END line.'; exit 1; }
          SPARE="palasora.$(printf '%s' "$HOST" | tr . -).sslip.io"
          DOMAIN=$(printf '%s' "$DOMAIN" | tr ',' ' ' | xargs)
          [ -n "$DOMAIN" ] || DOMAIN="palasora.com www.palasora.com $SPARE"
          OPTS="-i key -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20"
          scp $OPTS palasora.tgz "$USER@$HOST:/tmp/"
          ssh $OPTS "$USER@$HOST" "PALASORA_DOMAIN='$DOMAIN' bash -s" < infra/server/install.sh
          rm -f key
          echo "SITES=$DOMAIN" >> "$GITHUB_ENV"
          echo "::notice::Palasora answers at: $(printf 'https://%s ' $DOMAIN)"
      - name: Check the site answers
        run: |
          ok=0
          for n in $SITES; do
            up=0
            for i in $(seq 1 9); do curl -fsS -m 15 -o /dev/null "https://$n/api/v1/health" && { up=1; break; }; sleep 10; done
            if [ "$up" = 1 ]; then echo "OK: https://$n"; ok=1
            else echo "::warning::https://$n doesn't answer yet. For a domain, check its DNS A record points at the server (in Cloudflare: DNS only, grey cloud)."; fi
          done
          [ "$ok" = 1 ] || echo "::warning::Palasora runs on the server, but no address answers from outside yet. HTTPS certificates can take a minute; if it stays down, check that ports 80 and 443 are open in Oracle."
